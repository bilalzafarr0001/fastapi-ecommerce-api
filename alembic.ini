# Alembic configuration (database migrations).
#
# Common commands (run them from the project root):
#   alembic upgrade head                              -> apply all migrations
#   alembic revision --autogenerate -m "add x column" -> create a migration from your model changes
#   alembic downgrade -1                              -> undo the last migration
#   alembic history                                   -> list migrations
#
# The database URL is NOT stored here: alembic/env.py reads it from .env (app settings).

[alembic]
script_location = %(here)s/alembic
# Migration files start with their date, so they are listed in order
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
